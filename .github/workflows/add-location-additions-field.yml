name: Add FotoPlay location additions field

on:
  push:
    branches:
      - fix/location-additions

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Add FotoPlay location additions field'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/location-additions
      - name: Add only location additions UI and prompt mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/studio/AuthorProductionWorkspacePage.jsx')
          s = p.read_text()

          old = """    const characterDirections = frameCharacterDirections(panel);
    const environment = [segment.exact_area && `Exact set area: ${segment.exact_area}`, segment.environment_direction && `Environment: ${segment.environment_direction}`, segment.fixed_set_elements && `Fixed set elements: ${segment.fixed_set_elements}`, segment.image_instruction && `Shared visual direction: ${segment.image_instruction}`].filter(Boolean).join('\\n');
    const storyBeat = panel?.beat || segment.summary || '';
    return `Create one photorealistic live-action cinematic production still. Frame type: ${frameType}.\\n${panel?.frame_type === 'establishing' ? 'Build the image around the location, environment and atmosphere. Do not use character identity references and do not introduce identifiable principal cast members unless the story beat explicitly requires them.' : 'Preserve each named character only from that character\\'s own identity references. Do not transfer facial features, age, clothing or identity between characters.'}\\nUse the supplied reference images according to this exact mapping:\\n${manifest || 'No reference images supplied.'}\\n${environment}${environment ? '\\n' : ''}${characterDirections}${characterDirections ? '\\n' : ''}${storyBeat ? `Story beat: ${storyBeat}\\n` : ''}FRAME ${index + 1}/${panelCount}. Shot: ${panel.shot}. Do not add text, captions, borders, speech bubbles, illustration or graphic-novel styling.`;
"""
          new = """    const characterDirections = frameCharacterDirections(panel);
    const locationChanges = locations.map((location) => { const value = segment.location_changes?.[location.id]?.trim(); return value ? `${location.name}: ${value}` : ''; }).filter(Boolean).join('\\n');
    const environment = [segment.exact_area && `Exact set area: ${segment.exact_area}`, locationChanges && `Location additions / changes:\\n${locationChanges}`, segment.environment_direction && `Environment: ${segment.environment_direction}`, segment.fixed_set_elements && `Fixed set elements: ${segment.fixed_set_elements}`, segment.image_instruction && `Shared visual direction: ${segment.image_instruction}`].filter(Boolean).join('\\n');
    const storyBeat = panel?.beat || segment.summary || '';
    return `Create one photorealistic live-action cinematic production still. Frame type: ${frameType}.\\n${panel?.frame_type === 'establishing' ? 'Build the image around the location, environment and atmosphere. Do not use character identity references and do not introduce identifiable principal cast members unless the story beat explicitly requires them.' : 'Preserve each named character only from that character\\'s own identity references. Do not transfer facial features, age, clothing or identity between characters.'}\\nUse the supplied reference images according to this exact mapping:\\n${manifest || 'No reference images supplied.'}\\n${environment}${environment ? '\\n' : ''}${characterDirections}${characterDirections ? '\\n' : ''}${storyBeat ? `Story beat: ${storyBeat}\\n` : ''}FRAME ${index + 1}/${panelCount}. Shot: ${panel.shot}. Do not add text, captions, borders, speech bubbles, illustration or graphic-novel styling.`;
"""
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new)

          old = """    {tool === 'references' && <><div className=\"space-y-3\">{locations.map((location) => <ReferencePicker key={location.id} title={`${location.name} · set references`} images={assetGallery(location, catalogGalleries)} selected={selectedRefs(location, 'location_reference_images')} onChange={(images) => change({ location_reference_images: { ...segment.location_reference_images, [location.id]: images }, comic_page_source: '' })} />)}</div>{characters.map((character) =>"""
          new = """    {tool === 'references' && <><div className=\"space-y-3\">{locations.map((location) => <div key={location.id} className=\"space-y-2\"><ReferencePicker title={`${location.name} · set references`} images={assetGallery(location, catalogGalleries)} selected={selectedRefs(location, 'location_reference_images')} onChange={(images) => change({ location_reference_images: { ...segment.location_reference_images, [location.id]: images }, comic_page_source: '' })} /><input className={dark} value={segment.location_changes?.[location.id] || ''} onChange={(e) => change({ location_changes: { ...(segment.location_changes || {}), [location.id]: e.target.value }, comic_page_source: '' })} placeholder=\"Set additions / changes (clients, props, temporary elements)\" /></div>)}</div>{characters.map((character) =>"""
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new)

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/studio/AuthorProductionWorkspacePage.jsx
          git commit -m "Add FotoPlay location additions field"
          git push origin HEAD:fix/location-additions
