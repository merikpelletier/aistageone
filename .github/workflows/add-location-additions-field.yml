name: Add FotoPlay location additions field

on:
  push:
    branches:
      - fix/location-additions

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Add FotoPlay location additions field'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/location-additions
      - name: Patch FotoPlay location additions
        run: python3 -c "import base64; exec(base64.b64decode(''))"
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/studio/AuthorProductionWorkspacePage.jsx
          git commit -m "Add FotoPlay location additions field"
          git push origin HEAD:fix/location-additions
