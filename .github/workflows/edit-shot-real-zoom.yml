name: Edit Shot real zoom
on:
  push:
    branches: [main]
    paths: ['.github/workflows/edit-shot-real-zoom.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: |
          python3 -c "from pathlib import Path; p=Path('src/components/studio/VideoTools.jsx'); s=p.read_text(); s=s.replace(\"  const editTimelineTick = editTimelineZoom >= 3 ? 0.25 : editTimelineZoom >= 2 ? 0.5 : 1;\", \"  const editTimelineTick = editTimelineZoom >= 3 ? 0.25 : editTimelineZoom >= 2 ? 0.5 : 1;\\n  const editTimelinePixelsPerSecond = 44 * editTimelineZoom;\\n  const editTimelineWidth = Math.max(720, editTimelineDuration * editTimelinePixelsPerSecond);\", 1); s=s.replace(\"<div className=\\\"relative\\\" style={{ width: `${editTimelineZoom * 100}%`, minWidth: '720px' }}>\", \"<div className=\\\"relative\\\" style={{ width: `${editTimelineWidth}px` }}>\", 1); s=s.replace(\"style={{ left: `${editTimelineDuration ? (second / editTimelineDuration) * 100 : 0}%` }}\", \"style={{ left: `${second * editTimelinePixelsPerSecond}px` }}\", 1); s=s.replace(\"style={{ flex: `0 0 ${editTimelineDuration ? (duration / editTimelineDuration) * 100 : 0}%` }}\", \"style={{ flex: `0 0 ${duration * editTimelinePixelsPerSecond}px` }}\", 1); s=s.replace(\"style={{ left: `${editTimelineDuration > 0 ? Math.min(100, (editPlayhead / editTimelineDuration) * 100) : 0}%` }}\", \"style={{ left: `${editPlayhead * editTimelinePixelsPerSecond}px` }}\", 1); p.write_text(s)"
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run build
      - run: |
          git config user.name 'AISTAGE automation'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/edit-shot-real-zoom.yml
          git add src/components/studio/VideoTools.jsx
          git diff --cached --stat
          git commit -m 'Fix Edit Shot real timeline zoom'
          git push origin HEAD:main
