name: Apply optional shot character fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-optional-shot-characters.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .tmp/clear-optional-shot-characters.py
      - run: npm install --no-package-lock --no-audit --no-fund && npm run build
      - run: git rm .tmp/clear-optional-shot-characters.py .github/workflows/apply-optional-shot-characters.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Make establishing and insert characters optional
          file_pattern: src/components/studio/VideoTools.jsx .tmp/clear-optional-shot-characters.py .github/workflows/apply-optional-shot-characters.yml
