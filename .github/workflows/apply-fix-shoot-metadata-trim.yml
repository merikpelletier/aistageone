name: Apply Shoot metadata trim fix
on:
  push:
    paths:
      - '.tmp/fix-shoot-metadata-trim.py'
      - '.github/workflows/apply-fix-shoot-metadata-trim.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .tmp/fix-shoot-metadata-trim.py
      - name: Verify diff
        run: |
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "src/components/studio/VideoTools.jsx "
      - name: Build
        run: npm install --no-package-lock --no-audit --no-fund && npm run build
      - name: Remove temporary files
        run: git rm .tmp/fix-shoot-metadata-trim.py .github/workflows/apply-fix-shoot-metadata-trim.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Stop Shoot metadata from resetting trim
