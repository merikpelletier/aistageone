name: Fix Shoot replaced trim
on:
  push:
    branches:
      - fix-shoot-replaced-trim
    paths:
      - '.github/workflows/fix-shoot-replaced-trim.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply replaced-clip trim fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/studio/VideoTools.jsx')
          t = p.read_text()
          old = """      return sourceShot?.result_url && sourceShot.result_url !== clip.url
        ? { ...clip, url: sourceShot.result_url, trim_start: 0, trim_end: Math.max(0.1, Number(sourceShot.duration || 5)), source_duration: Math.max(0.1, Number(sourceShot.duration || 5)), reset_trim_on_load: true }
        : clip;"""
          new = """      return sourceShot?.result_url && sourceShot.result_url !== clip.url
        ? { ...clip, url: sourceShot.result_url, source_duration: Math.max(0.1, Number(sourceShot.duration || 5)) }
        : clip;"""
          if t.count(old) != 1:
              raise SystemExit(f'Expected exactly one replaced-clip block, found {t.count(old)}')
          p.write_text(t.replace(old, new, 1))
          PY
      - name: Verify only VideoTools changed
        run: |
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "src/components/studio/VideoTools.jsx "
      - name: Build
        run: npm install --no-package-lock --no-audit --no-fund && npm run build
      - name: Remove temporary workflow
        run: git rm .github/workflows/fix-shoot-replaced-trim.yml
      - name: Commit verified fix
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Preserve trim when Shoot clip is replaced
          branch: fix-shoot-replaced-trim
