name: Apply replaced source duration
on:
  push:
    branches: [main]
    paths: ['.tmp/fix-replaced-source-duration.py']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .tmp/fix-replaced-source-duration.py
      - run: git diff --check && npm install --no-package-lock --no-audit --no-fund && npm run build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/studio/VideoTools.jsx
          git rm .tmp/fix-replaced-source-duration.py .github/workflows/apply-replaced-source-duration.yml
          git commit -m "Use real media duration for replaced Shoot clips"
          git push
