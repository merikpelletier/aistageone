name: Apply Edit Shot timeline fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-edit-shot-timeline-fix.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .tmp/apply_edit_shot_timeline_fix.py
      - run: |
          test "$(git status --short | grep 'src/components/studio/VideoTools.jsx' | wc -l)" -eq 1
          git diff -- src/components/studio/VideoTools.jsx
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run build
      - run: |
          git config user.name "AISTAGE automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .tmp/edit-shot-timeline-fix.patch .tmp/apply_edit_shot_timeline_fix.py .github/workflows/apply-edit-shot-timeline-fix.yml
          git add src/components/studio/VideoTools.jsx
          git diff --cached --stat
          git commit -m "Fix Edit Shot zoom playback and mute"
          git push origin HEAD:main
