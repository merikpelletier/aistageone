name: Apply hidden Shoot music player
on:
  push:
    paths:
      - '.tmp/hide-shoot-music-player.py'
      - '.github/workflows/apply-hide-shoot-music-player.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .tmp/hide-shoot-music-player.py
      - name: Verify diff
        run: git diff --check && git diff --stat
      - name: Build
        run: npm install --no-package-lock --no-audit --no-fund && npm run build
      - name: Remove temporary files
        run: git rm .tmp/hide-shoot-music-player.py .github/workflows/apply-hide-shoot-music-player.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Hide redundant Shoot music player
