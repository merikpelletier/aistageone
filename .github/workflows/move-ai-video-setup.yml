name: Move AI Video into Setup

on:
  push:
    branches:
      - fix/dynamic-ai-video-model-options
    paths:
      - .github/workflows/move-ai-video-setup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dynamic-ai-video-model-options
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python .github/scripts/move-ai-video-setup.py
      - run: |
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "src/components/studio/VideoTools.jsx"
          git diff --check
      - run: npm install --no-package-lock
      - run: npm run build
      - run: |
          git config user.name "Sckript"
          git config user.email "88356362+merikpelletier@users.noreply.github.com"
          git add src/components/studio/VideoTools.jsx
          git commit -m "Place AI Video controls inside existing Shoot Setup"
          git push origin HEAD:fix/dynamic-ai-video-model-options
