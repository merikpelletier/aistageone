name: One-shot patch shot video replacement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-shot-video-replace.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply exact targeted patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/studio/VideoTools.jsx')
          text = path.read_text()

          replacements = []

          replacements.append((
          """    const extension = file.name?.split('.').pop() || 'mp4';
              const path = `${owner}/shoot/video-references/${crypto.randomUUID()}.${extension}`;
              const { error } = await supabase.storage.from('media').upload(path, file, { cacheControl: '3600', upsert: false, contentType: file.type || undefined });
              if (error) throw error;
              const { data } = supabase.storage.from('media').getPublicUrl(path);
              applyPickedVideoReference(data.publicUrl, file.name, target);
          """,
          """    const extension = file.name?.split('.').pop() || 'mp4';
              const folder = target?.type === 'shot-video-replacement' ? 'replacements' : 'video-references';
              const path = `${owner}/shoot/${folder}/${crypto.randomUUID()}.${extension}`;
              const { error } = await supabase.storage.from('media').upload(path, file, { cacheControl: '3600', upsert: false, contentType: file.type || undefined });
              if (error) throw error;
              const { data } = supabase.storage.from('media').getPublicUrl(path);
              await applyPickedVideoReference(data.publicUrl, file.name, target);
          """))

          replacements.append((
          """  const applyPickedVideoReference = (url, name, target = pickerTarget) => {
              if (!url || !target || target.type !== 'shot-video-reference') return;
          """,
          """  const replaceShotResult = async (shotId, url) => {
              if (!shotId || !url) return;
              const nextShots = shotPlan.map((shot) => shot.id === shotId ? { ...shot, result_url: url } : shot);
              setShotPlan(nextShots);
              setEditClips([]);
              setSelectedEditClipId(null);
              setEditPlayhead(0);
              const currentScene = sceneId || (await saveScene({ shot_plan: nextShots, status: 'shooting' })).id;
              const { error } = await supabase.from('shoot_scene').update({ shot_plan: nextShots, status: 'shooting', updated_at: new Date().toISOString() }).eq('id', currentScene);
              if (error) throw error;
              toast.success('Shot video replaced');
            };

            const applyPickedVideoReference = async (url, name, target = pickerTarget) => {
              if (!url || !target) return;
              if (target.type === 'shot-video-replacement') {
                try {
                  await replaceShotResult(target.shotId, url);
                  setShowVaultPicker(false);
                  setPickerTarget(null);
                } catch (error) {
                  toast.error(error?.message || 'Shot video could not be replaced.');
                }
                return;
              }
              if (target.type !== 'shot-video-reference') return;
          """))

          replacements.append((
          """>Save Shot to Vault</button></div><div className=\"mt-2 border-t border-white/10 pt-2\">""",
          """>Save Shot to Vault</button></div><div className=\"mt-2 grid grid-cols-2 gap-2\"><label className=\"flex cursor-pointer items-center justify-center bg-white/10 py-3 text-xs font-bold hover:bg-white/15\"><Upload size={14} className=\"mr-2\" /> Upload Video<input type=\"file\" accept=\"video/mp4,video/quicktime,video/*\" className=\"hidden\" onChange={(event) => { const file = event.target.files?.[0]; event.target.value = ''; if (file) uploadVideoReference(file, { type: 'shot-video-replacement', shotId: activeShot.id }).catch((error) => toast.error(error.message || 'Video upload failed.')); }} /></label><button type=\"button\" onClick={() => { setPickerTarget({ type: 'shot-video-replacement', shotId: activeShot.id }); setShowVaultPicker(true); }} className=\"flex items-center justify-center bg-white/10 py-3 text-xs font-bold hover:bg-white/15\"><Folder size={14} className=\"mr-2\" /> Replace from Vault</button></div><div className=\"mt-2 border-t border-white/10 pt-2\">"""))

          replacements.append((
          """mediaType={pickerTarget?.type === 'music' ? 'audio' : pickerTarget?.type === 'shot-video-reference' ? 'video' : 'image'} onSelect={(url, name) => pickerTarget?.type === 'shot-video-reference' ? applyPickedVideoReference(url, name || 'Vault video reference') : applyPickedImage(url, name || (pickerTarget?.type === 'music' ? 'Vault music' : 'Vault reference'))}""",
          """mediaType={pickerTarget?.type === 'music' ? 'audio' : (pickerTarget?.type === 'shot-video-reference' || pickerTarget?.type === 'shot-video-replacement') ? 'video' : 'image'} onSelect={(url, name) => (pickerTarget?.type === 'shot-video-reference' || pickerTarget?.type === 'shot-video-replacement') ? applyPickedVideoReference(url, name || (pickerTarget?.type === 'shot-video-replacement' ? 'Vault replacement video' : 'Vault video reference')) : applyPickedImage(url, name || (pickerTarget?.type === 'music' ? 'Vault music' : 'Vault reference'))}"""))

          for index, (old, new) in enumerate(replacements, 1):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Patch block {index} expected exactly once, found {count}. No file written.')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "Sckript"
          git config user.email "88356362+merikpelletier@users.noreply.github.com"
          rm .github/workflows/one-shot-shot-video-replace.yml
          git add src/components/studio/VideoTools.jsx .github/workflows/one-shot-shot-video-replace.yml
          git commit -m "Add shot video replacement from upload or Vault [skip ci]"
          git push origin HEAD:main
