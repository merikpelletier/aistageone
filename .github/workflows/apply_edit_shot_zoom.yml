name: Apply Edit Shot zoom fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply_edit_shot_zoom.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .tmp/fix_edit_shot_zoom.py
      - run: npm install --no-package-lock --no-audit --no-fund && npm run build
      - run: |
          git config user.name "AISTAGE automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .tmp/fix_edit_shot_zoom.py .github/workflows/apply_edit_shot_zoom.yml
          git add src/components/studio/VideoTools.jsx
          git commit -m "Fix Edit Shot timeline zoom behavior"
          git push origin HEAD:main
