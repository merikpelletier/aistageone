name: Apply Music duration fix
on:
  push:
    paths:
      - '.github/workflows/apply-music-duration-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python3 .tmp/music-duration-fix.py
      - name: Build
        run: npm install --no-package-lock --no-audit --no-fund && npm run build
      - name: Remove temporary files
        run: git rm .tmp/music-duration-fix.py .github/workflows/apply-music-duration-fix.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Add Music duration control
