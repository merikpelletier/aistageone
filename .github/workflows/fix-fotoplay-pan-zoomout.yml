name: Fix FotoPlay pan and zoom out

on:
  push:
    branches:
      - fix/fotoplay-pan-zoomout

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix FotoPlay horizontal pan and zoom out'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fotoplay-pan-zoomout
      - name: Apply targeted FotoPlay pan and zoom patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/studio/AuthorProductionWorkspacePage.jsx')
          s = p.read_text()

          old = "const scale = Math.max(slot.w / bitmap.width, slot.h / bitmap.height) * Math.max(1, Number(zoom) / 100);"
          new = "const scale = Math.max(slot.w / bitmap.width, slot.h / bitmap.height) * Math.max(0.5, Number(zoom) / 100);"
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new)

          old = "const x = slot.x + (slot.w - dw) * (Number(posX) / 100);"
          new = "const x = slot.x + (slot.w - dw) * (Number(posX) / 100) + ((Number(posX) - 50) / 500) * dw;"
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new)

          old = "transform: `scale(${Math.max(1, Number(panel.zoom ?? 100) / 100)})`"
          new = "transform: `translateX(${(Number(panel.position_x ?? 50) - 50) / 5}%) scale(${Math.max(0.5, Number(panel.zoom ?? 100) / 100)})`"
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new)

          old = 'type="range" min="100" max="200" value={selected.zoom ?? 100}'
          new = 'type="range" min="50" max="200" value={selected.zoom ?? 100}'
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new)

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/studio/AuthorProductionWorkspacePage.jsx
          git commit -m "Fix FotoPlay horizontal pan and zoom out"
          git push origin HEAD:fix/fotoplay-pan-zoomout
