name: Apply Edit Shot timeline autosave
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-edit-shot-autosave.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .tmp/edit-shot-autosave.py
      - run: npm install --no-package-lock --no-audit --no-fund && npm run build
      - run: |
          git config user.name "AISTAGE automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .tmp/edit-shot-autosave.py .github/workflows/apply-edit-shot-autosave.yml
          git add src/components/studio/VideoTools.jsx
          git commit -m "Autosave Edit Shot timeline changes"
          git push origin HEAD:main
