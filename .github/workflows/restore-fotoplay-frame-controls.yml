name: Restore FotoPlay frame controls

on:
  push:
    branches:
      - restore-frame-zoom-position

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Restore FotoPlay frame zoom and position controls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore-frame-zoom-position
      - name: Patch selected frame controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/studio/AuthorProductionWorkspacePage.jsx')
          s = p.read_text()
          old = """async function drawCoverImage(ctx, source, slot, posX = 50, posY = 50) {
            const response = await fetch(source);
            if (!response.ok) throw new Error('Unable to load a panel image');
            const bitmap = await createImageBitmap(await response.blob());
            const scale = Math.max(slot.w / bitmap.width, slot.h / bitmap.height);
            const dw = bitmap.width * scale; const dh = bitmap.height * scale;
            const x = slot.x + (slot.w - dw) * (Number(posX) / 100);
            const y = slot.y + (slot.h - dh) * (Number(posY) / 100);
            ctx.drawImage(bitmap, x, y, dw, dh); bitmap.close();
          }"""
          new = """async function drawCoverImage(ctx, source, slot, posX = 50, posY = 50, zoom = 100) {
            const response = await fetch(source);
            if (!response.ok) throw new Error('Unable to load a panel image');
            const bitmap = await createImageBitmap(await response.blob());
            const scale = Math.max(slot.w / bitmap.width, slot.h / bitmap.height) * Math.max(1, Number(zoom) / 100);
            const dw = bitmap.width * scale; const dh = bitmap.height * scale;
            const x = slot.x + (slot.w - dw) * (Number(posX) / 100);
            const y = slot.y + (slot.h - dh) * (Number(posY) / 100);
            ctx.drawImage(bitmap, x, y, dw, dh); bitmap.close();
          }"""
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new)
          old = "await drawCoverImage(ctx, panel.image_url, slot, panel.position_x ?? 50, panel.position_y ?? 50);"
          new = "await drawCoverImage(ctx, panel.image_url, slot, panel.position_x ?? 50, panel.position_y ?? 50, panel.zoom ?? 100);"
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new)
          old = "if (!panel?.split) return panel?.image_url ? <img src={panel.image_url} alt=\"\" className=\"h-full w-full object-cover\" style={{ objectPosition: `${panel.position_x ?? 50}% ${panel.position_y ?? 50}%` }} /> : <div className=\"flex h-full w-full items-center justify-center text-white/25\"><ImageIcon size={28} /></div>;"
          new = "if (!panel?.split) return panel?.image_url ? <img src={panel.image_url} alt=\"\" className=\"h-full w-full object-cover\" style={{ objectPosition: `${panel.position_x ?? 50}% ${panel.position_y ?? 50}%`, transform: `scale(${Math.max(1, Number(panel.zoom ?? 100) / 100)})`, transformOrigin: `${panel.position_x ?? 50}% ${panel.position_y ?? 50}%` }} /> : <div className=\"flex h-full w-full items-center justify-center text-white/25\"><ImageIcon size={28} /></div>;"
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new)
          needle = '<div><p className="mb-1 text-[10px] font-black uppercase text-white/45">Generated frame prompt</p><textarea value={framePrompt(selected, selectedPanel)} readOnly rows={10} className={`${dark} opacity-80`} /></div>'
          controls = '<div className="space-y-3 border border-white/10 bg-[#181c21] p-3"><label className="block text-[10px] font-black uppercase text-white/50">Zoom · {selected.zoom ?? 100}%<input type="range" min="100" max="200" value={selected.zoom ?? 100} onChange={(e) => updatePanel(selectedPanel, { zoom: Number(e.target.value) })} className="mt-2 w-full accent-[#23c7be]" /></label><label className="block text-[10px] font-black uppercase text-white/50">Horizontal position · {selected.position_x ?? 50}<input type="range" min="0" max="100" value={selected.position_x ?? 50} onChange={(e) => updatePanel(selectedPanel, { position_x: Number(e.target.value) })} className="mt-2 w-full accent-[#23c7be]" /></label><label className="block text-[10px] font-black uppercase text-white/50">Vertical position · {selected.position_y ?? 50}<input type="range" min="0" max="100" value={selected.position_y ?? 50} onChange={(e) => updatePanel(selectedPanel, { position_y: Number(e.target.value) })} className="mt-2 w-full accent-[#23c7be]" /></label></div>'
          assert s.count(needle) == 1, s.count(needle)
          s = s.replace(needle, controls + needle)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/studio/AuthorProductionWorkspacePage.jsx
          git commit -m "Restore FotoPlay frame zoom and position controls"
          git push origin HEAD:restore-frame-zoom-position
