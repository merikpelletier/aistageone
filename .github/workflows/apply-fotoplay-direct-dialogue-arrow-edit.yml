name: Apply FotoPlay direct dialogue arrow edit
on:
  push:
    branches:
      - fix/fotoplay-direct-dialogue-arrow-edit
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply targeted patch
        run: python3 scripts/apply_fotoplay_direct_dialogue_arrow_edit.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify build
        run: npm run build
      - name: Keep only FotoPlay source change
        run: |
          git checkout -- package-lock.json || true
          git rm .github/workflows/apply-fotoplay-direct-dialogue-arrow-edit.yml scripts/apply_fotoplay_direct_dialogue_arrow_edit.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/studio/AuthorProductionWorkspacePage.jsx
          git commit -m "Allow direct dialogue arrow editing on FotoPlay page"
          git push origin HEAD:fix/fotoplay-direct-dialogue-arrow-edit
