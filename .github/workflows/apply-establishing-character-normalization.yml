name: Apply establishing character normalization fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-establishing-character-normalization.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .tmp/fix-establishing-character-normalization.py
      - run: npm install --no-package-lock --no-audit --no-fund && npm run build
      - run: git rm .tmp/fix-establishing-character-normalization.py .github/workflows/apply-establishing-character-normalization.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Stop establishing shots from restoring old characters
