name: Fix Shoot mobile playback
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch Shoot timeline playback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/studio/VideoTools.jsx')
          s = p.read_text()

          old = """  const editPreviewRef = useRef(null);\n  const editMusicPreviewRef = useRef(null);\n  const editTimelineViewportRef = useRef(null);"""
          new = """  const editPreviewRef = useRef(null);\n  const editPreloadRef = useRef(null);\n  const editMusicPreviewRef = useRef(null);\n  const editTimelineViewportRef = useRef(null);"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """  const selectedEditClip = editClips.find((clip) => clip.id === selectedEditClipId) || editClips[0] || null;\n  const selectedEditClipIndex = selectedEditClip ? editClips.findIndex((clip) => clip.id === selectedEditClip.id) : -1;"""
          new = """  const selectedEditClip = editClips.find((clip) => clip.id === selectedEditClipId) || editClips[0] || null;\n  const selectedEditClipIndex = selectedEditClip ? editClips.findIndex((clip) => clip.id === selectedEditClip.id) : -1;\n  const nextEditClip = selectedEditClipIndex >= 0 ? editClips[selectedEditClipIndex + 1] || null : null;"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """  const playEditTimeline = () => {\n    if (!editClips.length) return;\n    if (editPlayhead >= editTimelineDuration - 0.02) seekEditorPlayhead(0);\n    setEditPlaying(true);\n  };"""
          new = """  const playEditTimeline = () => {\n    if (!editClips.length) return;\n    const video = editPreviewRef.current;\n    if (!video) return;\n\n    if (editPlayhead >= editTimelineDuration - 0.02) {\n      const first = editClips[0];\n      setEditPlayhead(0);\n      setSelectedEditClipId(first.id);\n      try { video.currentTime = Math.max(0, Number(first.trim_start || 0)); } catch {}\n    }\n\n    setEditPlaying(true);\n    const result = video.play();\n    if (result && typeof result.catch === 'function') result.catch(() => setEditPlaying(false));\n  };"""
          assert old in s
          s = s.replace(old, new, 1)

          old = '<video key={selectedEditClip.id} ref={editPreviewRef} src={selectedEditClip.url} controls crossOrigin="anonymous" muted={Boolean(selectedEditClip.muted)}'
          new = '<video ref={editPreviewRef} src={selectedEditClip.url} controls crossOrigin="anonymous" playsInline preload="auto" muted={Boolean(selectedEditClip.muted)}'
          assert old in s
          s = s.replace(old, new, 1)

          old = 'style={{ width: \'100%\', height: \'100%\', objectFit: \'cover\', transform: `translate(${Number(selectedEditClip.x || 0)}%, ${Number(selectedEditClip.y || 0)}%) scale(${Number(selectedEditClip.scale || 1)})`, transformOrigin: \'center center\' }} /> : <div className="flex h-full min-h-64 items-center justify-center text-sm text-white/30">No generated shots in the editor.</div>}'
          new = 'style={{ width: \'100%\', height: \'100%\', objectFit: \'cover\', transform: `translate(${Number(selectedEditClip.x || 0)}%, ${Number(selectedEditClip.y || 0)}%) scale(${Number(selectedEditClip.scale || 1)})`, transformOrigin: \'center center\' }} /> : <div className="flex h-full min-h-64 items-center justify-center text-sm text-white/30">No generated shots in the editor.</div>}{nextEditClip?.url && <video ref={editPreloadRef} src={nextEditClip.url} preload="auto" playsInline muted className="hidden" aria-hidden="true" />}'
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Verify and push main
        shell: bash
        run: |
          git diff --check
          git diff -- src/components/studio/VideoTools.jsx
          git config user.name "Sckript"
          git config user.email "88356362+merikpelletier@users.noreply.github.com"
          git add src/components/studio/VideoTools.jsx
          git commit -m "Fix Shoot mobile timeline playback"
          git push origin HEAD:main
