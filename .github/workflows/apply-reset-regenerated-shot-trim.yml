name: Apply regenerated shot trim reset
on:
  push:
    paths:
      - '.tmp/reset-regenerated-shot-trim.py'
      - '.github/workflows/apply-reset-regenerated-shot-trim.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .tmp/reset-regenerated-shot-trim.py
      - name: Verify diff
        run: git diff --check && git diff --stat
      - name: Build
        run: npm install --no-package-lock --no-audit --no-fund && npm run build
      - name: Remove temporary files
        run: git rm .tmp/reset-regenerated-shot-trim.py .github/workflows/apply-reset-regenerated-shot-trim.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Reset trim when regenerated shot replaces clip
