name: Apply scoped Shoot prompt cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-prompt-cleanup.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .tmp/remove-no-character-rule.py
      - run: npm install --no-package-lock --no-audit --no-fund && npm run build
      - run: git rm .tmp/remove-no-character-rule.py .github/workflows/apply-prompt-cleanup.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Clean up Shoot prompt builder
