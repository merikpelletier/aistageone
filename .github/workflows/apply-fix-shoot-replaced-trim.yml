name: Apply replaced Shoot clip trim fix
on:
  push:
    paths:
      - '.tmp/fix-shoot-replaced-trim.py'
      - '.github/workflows/apply-fix-shoot-replaced-trim.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .tmp/fix-shoot-replaced-trim.py
      - name: Verify diff
        run: git diff --check && git diff --name-only && git diff --stat
      - name: Build
        run: npm install --no-package-lock --no-audit --no-fund && npm run build
      - name: Remove temporary files
        run: git rm .tmp/fix-shoot-replaced-trim.py .github/workflows/apply-fix-shoot-replaced-trim.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Preserve trim when Shoot clip is replaced
