name: Apply stale replaced trim migration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-stale-replaced-trim-migration.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .tmp/migrate-null-replaced-trim.py
      - run: git diff --check
      - run: npm install --no-package-lock --no-audit --no-fund && npm run build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/studio/VideoTools.jsx
          git commit -m "Migrate stale replaced Shoot trim"
          git push
